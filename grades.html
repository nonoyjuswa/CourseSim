<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourseSim – Grades</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="logo">CE</div>
          <div>
            <h1>CourseSim</h1>
            <p>Student Portal</p>
          </div>
        </div>
        <nav class="nav">
          <a id="navLogout" href="index.html">Login</a>
          <a href="courses.html">Courses</a>
          <a href="enrollments.html">Enrollments</a>
          <a class="active" href="grades.html">Grades</a>
        </nav>
      </div>
      <div class="user-card">
        <div class="avatar" id="sidebarAvatar">?</div>
        <div>
          <h3 id="sidebarName">Student</h3>
          <p  id="sidebarId">ID</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="hero">
        <h2>Grades</h2>
        <p>Assign and view grades for enrolled courses.</p>
      </header>

      <section class="panels">
        <div class="panel">
          <h3>Assign Grade</h3>
          <input id="studentName" type="text"   placeholder="Student name" />
          <input id="courseCode"  type="text"   placeholder="Course code (e.g. ICT 111)" />
          <input id="gradeInput"  type="number" placeholder="Grade 0–100" min="0" max="100" />
          <button onclick="assignGrade()">Save Grade</button>
          <p id="message"></p>
        </div>
        <div class="panel">
          <h3>All Enrollments</h3>
          <ul id="studentList"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
