<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourseSim – Enrollments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="logo">CE</div>
          <div>
            <h1>CourseSim</h1>
            <p>Student Portal</p>
          </div>
        </div>
        <nav class="nav">
          <a id="navLogout" href="index.html">Login</a>
          <a href="courses.html">Courses</a>
          <a class="active" href="enrollments.html">Enrollments</a>
          <a href="grades.html">Grades</a>
        </nav>
      </div>
      <div class="user-card">
        <div class="avatar" id="sidebarAvatar">?</div>
        <div>
          <h3 id="sidebarName">Student</h3>
          <p  id="sidebarId">ID</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="hero">
        <h2>Enrollments</h2>
        <p>View all student enrollments or drop a course below.</p>
      </header>

      <section class="panels">
        <div class="panel">
          <h3>Student Enrollments</h3>
          <ul id="studentList"></ul>
        </div>
        <div class="panel">
          <h3>Drop Course</h3>
          <input id="studentName" type="text" placeholder="Student name" />
          <input id="courseCode"  type="text" placeholder="Course code (e.g. ICT 111)" />
          <button class="alt" onclick="dropStudent()">Drop</button>
          <p id="message"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
